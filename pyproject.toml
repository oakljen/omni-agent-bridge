[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-agent-bridge"
version = "0.1.0"
description = "Bridge/CLI for connecting AI agents to OmniTools chat (omni.oakljen.com) via bot tokens"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "websocket-client>=1.6",
]

[project.scripts]
omni-agent-bridge = "omni_agent_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["omni_agent_bridge*"]
